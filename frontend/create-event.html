<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LPU Social | Create Event</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="create-event.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                LPU SOCIAL
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="events.html">Events</a>
                </li>

                <li>
                    <a href="create-event.html" class="active">
                        Create Event
                    </a>
                </li>

                <li>
                    <a href="#">My Events</a>
                </li>

            </ul>

            <div class="nav-auth" id="navAuth"></div>

        </div>

    </nav>


    <!-- ================= CREATE EVENT ================= -->

    <main class="create-event-page">

        <div class="create-event-container">

            <div class="create-event-header">

                <p class="page-label">
                    CAMPUS ACTIVITIES
                </p>

                <h1>Create an Event</h1>

                <p>
                    Create an event and invite students to participate.
                </p>

            </div>


            <form id="createEventForm">

                <!-- EVENT TITLE -->

                <div class="form-group">

                    <label for="title">
                        Event Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter event title"
                        required
                    >

                </div>


                <!-- CATEGORY + CAPACITY -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>

                            <option value="">
                                Select category
                            </option>

                            <option value="TECHNOLOGY">
                                Technology
                            </option>

                            <option value="SPORTS">
                                Sports
                            </option>

                            <option value="CULTURAL">
                                Cultural
                            </option>

                            <option value="ACADEMIC">
                                Academic
                            </option>

                            <option value="WORKSHOPS">
                                Workshops
                            </option>

                            <option value="OTHERS">
                                Others
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="capacity">
                            Maximum Participants
                        </label>

                        <input
                            type="number"
                            id="capacity"
                            min="1"
                            placeholder="100"
                            required
                        >

                    </div>

                </div>


                <!-- DATE + LOCATION -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            placeholder="Block 34, Room 402"
                            required
                        >

                    </div>

                </div>


                <!-- TIME -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="startTime">
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="startTime"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="endTime">
                            End Time
                        </label>

                        <input
                            type="time"
                            id="endTime"
                            required
                        >

                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="6"
                        placeholder="Describe your event..."
                        required
                    ></textarea>

                </div>


                <!-- IMAGE UPLOAD -->

                <div class="form-group">

                    <label for="eventImage">
                        Event Image
                    </label>

                    <input
                        type="file"
                        id="eventImage"
                        accept="image/*"
                    >

                    <small>
                        Select an image from your device.
                    </small>

                    <div
                        class="image-preview-container"
                        id="imagePreviewContainer"
                    >

                        <img
                            id="imagePreview"
                            alt="Event image preview"
                        >

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary create-event-btn"
                >
                    Create Event
                </button>


                <p id="message"></p>

            </form>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <div class="footer-logo">
                LPU SOCIAL
            </div>

            <p class="footer-tagline">
                Discover • Create • Participate
            </p>

            <div class="copyright">
                © 2026 LPU Social. All rights reserved.
            </div>

        </div>

    </footer>


    <script src="auth.js"></script>
    <script src="create-event.js"></script>

</body>

</html>
